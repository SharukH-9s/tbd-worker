[package]
name = "tbd-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# AMQP client for consuming from CloudAMQP (RabbitMQ)
lapin = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# UUID for idempotency tracking
uuid = { version = "1", features = ["v4", "serde"] }

# Postgres client for idempotency (processed_jobs table on Neon)
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "macros"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"

# Environment variable loading
dotenvy = "0.15"
futures = "0.3.33"
axum = "0.8"

# ── NEW: Email + PDF Stack ────────────────────────────────────────────────────

# Compile-time Jinja2-style HTML templates for email body
askama = "0.12"

# In-process Typst PDF rendering (replaces Gotenberg HTTP sidecar)
# All typst-* crates must share the same typst version (0.15.x)
typst = "0.15"               # explicit dep so we can use typst::foundations::Dict
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"           # same
derive_typst_intoval = "0.8" # 0.8 targets typst 0.15 (matches typst-as-lib)

# Brevo HTTP API for email delivery (SMTP is blocked on Render free tier)
# Port 443 HTTPS is always open; Brevo's transactional email REST API works fine.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
